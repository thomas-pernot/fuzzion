[package]
name = "fuzzion_core"
version = "0.1.0"
edition = "2021"

[dependencies]
wasm-bindgen = "0.2"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
ark-bn254 = "0.4.0"
ark-serialize = "0.4.0"
ark-ff = "0.4.0"
ark-groth16 = {version = "0.4.0", default-features = false}
ark-relations = "0.4.0"
ark-std = "0.4.0"
rand_chacha = "0.3.1"
rand_core = "0.6.4"
sha2 = "0.11.1"
subtle = "2.6.1"
ark-snark = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"